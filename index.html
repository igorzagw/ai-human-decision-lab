<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Human Decision Lab — Модель рішення для відбудови громад</title>
<meta name="description" content="Аналітичний інструмент: штучний інтелект рахує, людина вирішує.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9878;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Палітра свідомо бідна: один акцент і три відтінки тексту.
       Колір лишився тільки там, де він щось означає — статус або результат. */
    --bg:        #101216;
    --surface:   #171A1F;
    --border:    #262A31;
    --text:      #E6E8EB;
    --muted:     #9BA1AA;
    --faint:     #6B7280;
    --accent:    #5B93F0;
    --green:     #5FB98C;
    --red:       #DE7A76;
    --amber:     #CFA04A;
    --radius:    10px;
    --font:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono:      'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }

  /* ─────────── Екран входу ─────────── */

  #gate {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .gate-card {
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px 28px 26px;
  }

  .gate-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 18px;
    color: var(--muted);
  }
  .gate-mark svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .gate-card h1 { font-size: 18px; font-weight: 600; margin: 0 0 5px; letter-spacing: -.01em; }
  .gate-sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  input[type="password"]:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: #4A80DC; }
  .btn-primary:disabled { opacity: .5; cursor: progress; }

  .gate-msg {
    margin-top: 12px;
    font-size: 12.5px;
    min-height: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gate-msg.error { color: var(--red); }
  .gate-msg.work  { color: var(--muted); }

  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gate-foot {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--faint);
    line-height: 1.55;
  }
  .gate-foot code { font-family: var(--mono); font-size: 11px; }

  #app { display: none; }

  @media (max-width: 480px) {
    #gate { padding: 16px; }
    .gate-card { padding: 28px 22px 24px; }
  }
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>

    <h1>AI-Human Decision&nbsp;Lab</h1>
    <p class="gate-sub">Модель рішення для відбудови громад. Доступ обмежений.</p>

    <div class="field">
      <label for="pw">Пароль</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus required>
    </div>

    <button type="submit" class="btn-primary" id="gate-btn">Розшифрувати та увійти</button>

    <div class="gate-msg" id="gate-msg" role="status" aria-live="polite"></div>

    <p class="gate-foot">
      Застосунок зберігається у зашифрованому вигляді (<code>AES-256-GCM</code>, ключ
      із пароля через <code>PBKDF2-SHA256</code>). Без пароля вміст неможливо прочитати
      навіть із вихідного коду сторінки.
    </p>
  </form>
</div>

<div id="app"></div>

<script>
(() => {
  'use strict';

  const form = document.getElementById('gate-form');
  const input = document.getElementById('pw');
  const btn = document.getElementById('gate-btn');
  const msg = document.getElementById('gate-msg');

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  function say(text, kind) {
    msg.className = 'gate-msg' + (kind ? ' ' + kind : '');
    msg.textContent = '';
    if (kind === 'work') {
      const sp = document.createElement('span');
      sp.className = 'spinner';
      msg.appendChild(sp);
    }
    msg.appendChild(document.createTextNode(text));
  }

  async function deriveKey(password, kdf) {
    const material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'],
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: unb64(kdf.salt), iterations: kdf.iterations, hash: kdf.hash },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
    );
  }

  /* Монтує розшифрований пакет. innerHTML не виконує <script>,
     тому розмітка, стилі та код підключаються окремо і саме в цьому порядку. */
  function mount(bundle) {
    document.getElementById('gate').remove();

    const style = document.createElement('style');
    style.textContent = bundle.css;
    document.head.appendChild(style);

    const app = document.getElementById('app');
    app.innerHTML = bundle.html;
    app.style.display = 'block';

    const script = document.createElement('script');
    script.textContent = bundle.js;
    document.body.appendChild(script);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = input.value;
    if (!password) return;

    btn.disabled = true;
    say('Розшифрування…', 'work');

    try {
      const res = await fetch('app.enc', { cache: 'no-store' });
      if (!res.ok) throw new Error('Не знайдено app.enc — застосунок ще не зібрано');
      const env = await res.json();

      const key = await deriveKey(password, env.kdf);

      let plain;
      try {
        plain = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data),
        );
      } catch {
        /* GCM має вбудовану перевірку цілісності: хибний ключ не дає «сміття»,
           а просто не проходить автентифікацію. Тому це і є перевірка пароля. */
        throw new Error('Хибний пароль');
      }

      mount(JSON.parse(new TextDecoder().decode(plain)));
    } catch (err) {
      say(err.message, 'error');
      btn.disabled = false;
      input.select();
    }
  });
})();
</script>
</body>
</html>
